<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="SERENO"/>
  <meta name="theme-color" content="#1a1612"/>
  <title>SERENO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#1a1612;--parchment:#f5f0e8;--cream:#faf7f2;
      --sage:#7a8c6e;--sage-light:#a8b89a;
      --rust:#8b4a2f;--rust-light:#c4785a;
      --gold:#b8953a;--gold-light:#d4af6a;
      --stone:#c8bfb0;--stone-dark:#8a7f72;
      --shadow:rgba(26,22,18,0.12);
    }
    body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh}
    .header{background:var(--ink);color:var(--parchment);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
    .header-logo img{height:42px;object-fit:contain}
    .header-sub{font-size:11px;color:var(--stone);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
    .nav{background:var(--cream);border-bottom:1px solid var(--stone);display:flex;gap:0}
    .nav-btn{padding:12px 24px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--stone-dark);border-bottom:3px solid transparent;margin-bottom:-1px;transition:all .2s;font-family:'DM Sans',sans-serif;letter-spacing:.04em}
    .nav-btn:hover{color:var(--ink)}
    .nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
    .breadcrumb{background:var(--cream);border-bottom:1px solid var(--stone);padding:10px 28px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--stone-dark)}
    .breadcrumb span{cursor:pointer;transition:color .15s}.breadcrumb span:hover{color:var(--rust)}
    .breadcrumb .active{color:var(--ink);font-weight:500;cursor:default}
    .breadcrumb .sep{color:var(--stone)}
    .main{padding:28px;max-width:1100px;margin:0 auto}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;margin-bottom:6px}
    .section-sub{font-size:13px;color:var(--stone-dark);margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .card{background:white;border:1px solid var(--stone);border-radius:8px;padding:22px 18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold)}
    .card:hover{border-color:var(--gold);box-shadow:0 6px 24px var(--shadow);transform:translateY(-2px)}
    .card-icon{font-size:26px;margin-bottom:10px}
    .card-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin-bottom:6px}
    .card-sub{font-size:12px;color:var(--stone-dark)}
    .btn-add{background:var(--ink);color:var(--parchment);border:none;padding:10px 20px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s;margin-bottom:22px}
    .btn-add:hover{background:var(--rust)}
    .btn-save{background:var(--ink);color:var(--parchment);border:none;padding:10px 22px;border-radius:6px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s}
    .btn-save:hover{background:var(--rust)}
    .btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--stone);padding:9px 18px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
    .btn-secondary:hover{border-color:var(--ink)}
    .form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    .form-group label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--stone-dark);font-weight:500}
    .form-group input,.form-group select,.form-group textarea{border:1px solid var(--stone);border-radius:5px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--cream);transition:border-color .15s;width:100%}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--gold)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-grid .full{grid-column:1/-1}
    .modal-overlay{position:fixed;inset:0;background:rgba(26,22,18,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
    .modal{background:white;border-radius:10px;padding:28px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto}
    .modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:20px}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .mare-card{background:white;border:1px solid var(--stone);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .2s}
    .mare-card:hover{border-color:var(--sage);box-shadow:0 6px 24px var(--shadow);transform:translateY(-2px)}
    .mare-photo{width:100%;height:130px;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--stone);overflow:hidden}
    .mare-photo img{width:100%;height:100%;object-fit:cover}
    .mare-info{padding:12px 14px}
    .mare-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600}
    .mare-breed{font-size:12px;color:var(--stone-dark);margin-top:2px}
    .mare-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
    .tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
    .tag-gyn{background:#e8f0e4;color:var(--sage)}.tag-gest{background:#fef3e2;color:var(--gold)}.tag-neo{background:#fde8e0;color:var(--rust)}.tag-rec{background:#e8e4f0;color:#6a5a8b}
    .ficha-tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:2px solid var(--stone)}
    .ficha-tab{padding:11px 22px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--stone-dark);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:'DM Sans',sans-serif;letter-spacing:.04em}
    .ficha-tab.active-gyn{color:var(--sage);border-bottom-color:var(--sage)}
    .ficha-tab.active-gest{color:var(--gold);border-bottom-color:var(--gold)}
    .ficha-tab.active-neo{color:var(--rust);border-bottom-color:var(--rust)}
    .ficha-panel{background:white;border:1px solid var(--stone);border-radius:10px;padding:24px}
    .ficha-section-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--ink);margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--stone)}
    .ficha-section-title:first-child{margin-top:0}
    .btn-ficha-add{background:transparent;border:1px dashed var(--stone);color:var(--stone-dark);padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-bottom:14px}
    .btn-ficha-add:hover{border-color:var(--sage);color:var(--sage)}
    .eco-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
    .eco-table th{text-align:left;padding:7px 10px;background:var(--parchment);color:var(--stone-dark);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--stone)}
    .eco-table td{padding:7px 10px;border-bottom:1px solid #f0ece4}
    .eco-table input{border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;width:100%;color:var(--ink)}
    .eco-table input:focus{outline:none;background:var(--parchment);border-radius:3px}
    .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
    .badge-pos{background:#e8f0e4;color:var(--sage)}.badge-neg{background:#fde8e0;color:var(--rust)}.badge-pend{background:#fef3e2;color:var(--gold)}
    .mare-detail-header{display:flex;gap:24px;align-items:flex-start;margin-bottom:28px;background:white;border:1px solid var(--stone);border-radius:10px;padding:22px}
    .mare-detail-photo{width:130px;height:130px;border-radius:8px;overflow:hidden;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:50px;color:var(--stone);flex-shrink:0;cursor:pointer;position:relative}
    .mare-detail-photo img{width:100%;height:100%;object-fit:cover}
    .photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:12px;color:white;flex-direction:column;gap:3px}
    .mare-detail-photo:hover .photo-overlay{opacity:1}
    .mare-detail-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;margin-bottom:4px}
    .mare-detail-meta{font-size:13px;color:var(--stone-dark);margin-bottom:14px}
    .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .meta-item label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--stone-dark);display:block;margin-bottom:2px}
    .meta-item span{font-size:14px;font-weight:500}
    .empty{text-align:center;padding:48px 20px;color:var(--stone-dark)}
    .empty-icon{font-size:40px;margin-bottom:12px}
    .empty-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:6px}
    .empty-sub{font-size:13px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 24px;border-radius:8px;font-size:14px;z-index:200;animation:fadeIn .3s}
    .toast.error{background:var(--rust)}
    @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .saving{color:var(--stone-dark);font-size:12px;margin-left:10px}
    .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#6a5a8b;font-weight:500}
    .rec-badge{display:inline-flex;align-items:center;gap:6px;background:#f0edf8;border:1px solid #c8bfe0;border-radius:6px;padding:6px 12px;font-size:12px;color:#6a5a8b;font-weight:500;margin-top:8px}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr}.meta-grid{grid-template-columns:1fr 1fr}.mare-detail-header{flex-direction:column}}
    .stat-card{background:white;border:1px solid var(--stone);border-radius:8px;padding:20px;margin-bottom:16px}
    .stat-card-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;margin-bottom:14px;color:var(--ink)}
    .stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
    .stat-bar-label{width:140px;color:var(--stone-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stat-bar-track{flex:1;height:8px;background:#f0ece4;border-radius:4px;overflow:hidden}
    .stat-bar-fill{height:100%;border-radius:4px;transition:width .5s}
    .stat-bar-pct{width:36px;text-align:right;font-weight:600;color:var(--stone-dark)}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .stat-table{width:100%;border-collapse:collapse;font-size:12px}
    .stat-table th{text-align:left;padding:7px 10px;background:var(--parchment);color:var(--stone-dark);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
    .stat-table td{padding:7px 10px;border-bottom:1px solid #f0ece4}
    @media(max-width:700px){.stat-grid{grid-template-columns:1fr}}
    .intern-card{background:white;border:1px solid var(--stone);border-radius:8px;padding:18px;margin-bottom:14px}
    .intern-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
    .intern-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600}
    .vital-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
    .vital-table th{text-align:left;padding:6px 8px;background:var(--parchment);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--stone-dark)}
    .vital-table td{padding:6px 8px;border-bottom:1px solid #f0ece4}
    .vital-table input{border:none;background:transparent;font-size:12px;width:100%;font-family:'DM Sans',sans-serif}
    .vital-table input:focus{outline:none;background:var(--parchment);border-radius:3px}
    .pac-card{background:white;border:1px solid var(--stone);border-radius:8px;padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
    .pac-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--sage)}
    .pac-card:hover{border-color:var(--sage);box-shadow:0 6px 24px var(--shadow);transform:translateY(-2px)}
    .pac-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;margin-bottom:4px}
    .pac-sub{font-size:12px;color:var(--stone-dark)}
  </style>
</head>

const HARAS_INICIALES = ['Windcrest','La Carlota del Monte','Las Hermanas','SIRE','Haras Felicitas','Haras Elevage','Lupe Di Salvo','Pampy Heguy','Windcrest Epica'];

// ── Supabase helpers ──
async function dbGet(table, filter='') {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?order=id'+filter, {
    headers: {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });
  return r.ok ? r.json() : [];
}
async function dbPost(table, body) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table, {
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  return r.ok ? r.json() : null;
}
async function dbPatch(table, id, body) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  return r.ok ? r.json() : null;
}
async function dbDelete(table, id) {
  await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {
    method:'DELETE',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  });
}

// ── State ──
let state = {
  view: 'haras', // haras | mares | mare | internacion | paciente | estadisticas
  harasList: [],
  pacientes: [],
  selectedHaras: null,
  selectedMare: null,
  selectedPaciente: null,
  activeTab: 'gyn',
  modal: null,
  toast: null,
  toastTimer: null,
  saving: false,
  newHarasName: '',
  newMare: {name:'',breed:'',born:'',color:'',rp:'',chip:'',isReceptora:false},
  newPaciente: {nombre:'',especie:'Equino',sexo:'',pelaje:'',raza:'',madre:'',padre:'',propietario:'',haras:''},
};

function setState(patch) { Object.assign(state, patch); render(); }
function showToast(msg, type='success') {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  const timer = setTimeout(() => setState({toast:null,toastTimer:null}), 3200);
  setState({toast:{msg,type},toastTimer:timer});
}

// ── Getters ──
function getHaras(id) { return state.harasList.find(h=>h.id===id); }
function getMare(hid, mid) { const h=getHaras(hid); return h ? h.mares.find(m=>m.id===mid) : null; }

// ── Data init ──
async function initData() {
  let haras = await dbGet('haras');
  if (!haras.length) {
    for (const n of HARAS_INICIALES) {
      const res = await dbPost('haras', {nombre: n});
      if (res && res[0]) haras.push({...res[0], mares:[]});
    }
  } else {
    for (const h of haras) {
      const yeguas = await dbGet('yeguas', '&haras_id=eq.'+h.id);
      for (const y of yeguas) {
        try { y.gyn = await dbGet('gyn', '&yegua_id=eq.'+y.id+'&order=id.desc'); } catch { y.gyn = []; }
        try { y.gest = await dbGet('gestacion', '&yegua_id=eq.'+y.id+'&order=id.desc'); } catch { y.gest = []; }
        try { y.neo = await dbGet('neonatologia', '&yegua_id=eq.'+y.id+'&order=id.desc'); } catch { y.neo = []; }
        y.gyn = y.gyn || [];
        y.gest = y.gest || [];
        y.neo = y.neo || [];
        y.rec = [];
        y.mares = [];
      }
      h.mares = yeguas;
    }
  }
  const pacs = await dbGet('pacientes');
  for (const p of pacs) {
    p.internaciones = await dbGet('internaciones', '&paciente_id=eq.'+p.id);
  }
  setState({harasList: haras, pacientes: pacs});
}

// ── CRUD ──
async function addHaras() {
  const name = state.newHarasName.trim();
  if (!name) return;
  setState({saving:true});
  const res = await dbPost('haras', {nombre:name});
  if (res && res[0]) {
    state.harasList.push({...res[0], mares:[]});
    showToast('Haras agregado ✓');
  }
  setState({saving:false, newHarasName:'', modal:null});
}
async function addMare() {
  if (!state.newMare.name.trim()) return;
  setState({saving:true});
  const h = getHaras(state.selectedHaras);
  const body = {
    haras_id: h.id,
    nombre: state.newMare.name,
    raza: state.newMare.breed||null,
    nacimiento: state.newMare.born||null,
    pelaje: state.newMare.color||null,
    rp: state.newMare.rp||null,
    chip: state.newMare.chip||null,
    es_receptora: state.newMare.isReceptora||false,
    foto: null
  };
  const res = await dbPost('yeguas', body);
  if (res && res[0]) {
    const y = {...res[0], name:res[0].nombre, breed:res[0].raza, born:res[0].nacimiento, color:res[0].pelaje, isReceptora:res[0].es_receptora, photo:null, gyn:[], gest:[], neo:[], rec:[]};
    h.mares.push(y);
    showToast(y.nombre+' agregada ✓');
  }
  setState({saving:false, newMare:{name:'',breed:'',born:'',color:'',rp:'',chip:'',isReceptora:false}, modal:null});
}
async function addPaciente() {
  if (!state.newPaciente.nombre.trim()) return;
  setState({saving:true});
  const res = await dbPost('pacientes', state.newPaciente);
  if (res && res[0]) {
    state.pacientes.push({...res[0], internaciones:[]});
    showToast('Paciente agregado ✓');
  }
  setState({saving:false, newPaciente:{nombre:'',especie:'Equino',sexo:'',pelaje:'',raza:'',madre:'',padre:'',propietario:'',haras:''}, modal:null});
}
async function addGyn(hid, mid) {
  setState({saving:true});
  const y = getMare(hid, mid);
  const body = {yegua_id: y.id, fecha: new Date().toISOString().slice(0,10), padrillo:'', tecnica:'IA', datos:{}};
  const res = await dbPost('gyn', body);
  if (res && res[0]) { y.gyn.unshift(res[0]); showToast('Ficha ginecológica creada ✓'); }
  setState({saving:false});
}
async function addGest(hid, mid) {
  setState({saving:true});

  const body = {yegua_id: y.id, fecha_ovulacion: new Date().toISOString().slice(0,10), padrillo:'', datos:{}};

  setState({saving:false});
}
async function addNeo(hid, mid) {
  setState({saving:true});
  const y = getMare(hid, mid);
  const body = {yegua_id: y.id, fecha: new Date().toISOString().slice(0,10), datos:{}};
  const res = await dbPost('neonatologia', body);
  if (res && res[0]) { y.neo.unshift(res[0]); showToast('Ficha neo creada ✓'); }
  setState({saving:false});
}
async function saveGynField(fichaId, field, value, hid, mid) {
  const y = getMare(hid, mid);
  const ficha = y.gyn.find(f=>f.id===fichaId);
  if (!ficha) return;
  if (field === 'datos') {
    await dbPatch('gyn', fichaId, {datos: value});
    ficha.datos = value;
  } else {
    const patch = {};
    patch[field] = value;
    await dbPatch('gyn', fichaId, patch);
    ficha[field] = value;
  }
}
async function addInternacion(pid) {
  setState({saving:true});
  const p = state.pacientes.find(x=>x.id===pid);
  const body = {paciente_id:p.id, fecha_ingreso: new Date().toISOString().slice(0,10), motivo:'', datos:{}};
  const res = await dbPost('internaciones', body);
  if (res && res[0]) { p.internaciones.push(res[0]); showToast('Internación creada ✓'); }
  setState({saving:false});
}

// ── Photo ──
function handlePhoto(e, hid, mid) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const y = getMare(hid, mid);
    await dbPatch('yeguas', y.id, {foto: ev.target.result});
    y.foto = ev.target.result;
    y.photo = ev.target.result;
    if (state.selectedMare === mid) setState({selectedMare: mid});
    else render();
  };
  reader.readAsDataURL(file);
}

// ── Render helpers ──
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k,v] of Object.entries(attrs)) {
      if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'className') el.className = v;
      else if (k === 'htmlFor') el.setAttribute('for', v);
      else if (k === 'checked') el.checked = v;
      else if (k === 'selected') el.selected = v;
      else el.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  return el;
}
function div(cls, ...children) { return h('div', cls ? {className:cls} : {}, ...children); }
function span(cls, txt) { return h('span', cls ? {className:cls} : {}, txt); }

function renderHeader() {
  const img = h('img', {src:LOGO, alt:'SERENO', style:'height:42px;object-fit:contain'});
  return h('div', {className:'header'},

function renderGynPanel(panel, mare) {
  const btn = h('button',{className:'btn-ficha-add',onClick:()=>addGyn(state.selectedHaras,state.selectedMare)},'＋ Nueva ficha ginecológica');
  panel.appendChild(btn);
  if (!mare.gyn||!mare.gyn.length) {
    panel.appendChild(div('empty',h('div',{className:'empty-sub'},'Sin fichas ginecológicas aún')));
    return;
  }
  for (const f of mare.gyn) {
    const datos = f.datos || {};
    const card = div(null);
    card.style.cssText='background:var(--parchment);border-radius:8px;padding:16px;margin-bottom:14px;border:1px solid var(--stone)';
    const title = div('ficha-section-title');
    title.textContent='Ficha '+f.fecha;
    card.appendChild(title);

    const g1 = div('form-grid');
    const fields = [['Fecha','fecha',f.fecha],['Padrillo','padrillo',f.padrillo||''],['Técnica','tecnica',f.tecnica||'IA']];
    for (const [label,field,val] of fields) {
      const fg = div('form-group');
      fg.appendChild(h('label',{},label));
      let inp;
      if (field==='tecnica') {
        inp = h('select',{});
        for (const opt of ['IA','TE','ICSI','Monta natural']) {
          inp.appendChild(h('option',{value:opt,selected:opt===val},opt));
        }
      } else {
        inp = h('input',{type:field==='fecha'?'date':'text',value:val});
      }
      inp.addEventListener('change',async e=>{
        await saveGynField(f.id,field,e.target.value,state.selectedHaras,state.selectedMare);
      });
      fg.appendChild(inp);
      g1.appendChild(fg);
    }
    card.appendChild(g1);

    // Ecografías
    const ecoTitle = div('ficha-section-title');
    ecoTitle.textContent='Ecografías';
    card.appendChild(ecoTitle);

    const table = h('table',{className:'eco-table'});
    const thead = h('thead',{},h('tr',{},
      ...['Fecha','Ov. Izq.','Ov. Der.','Útero','Obs.'].map(t=>h('th',{},t))
    ));
    table.appendChild(thead);
    const tbody = h('tbody',{});
    const ecos = datos.ecos || [];
    const renderEcos = () => {
      tbody.innerHTML='';
      for (let i=0;i<ecos.length;i++) {
        const eco=ecos[i];
        const tr=h('tr',{});
        for (const field of ['fecha','ovIzq','ovDer','utero','obs']) {
          const td=h('td',{});
          const inp=h('input',{type:field==='fecha'?'date':'text',value:eco[field]||''});
          inp.addEventListener('change',async e=>{
            ecos[i][field]=e.target.value;
            await saveGynField(f.id,'datos',{...datos,ecos},state.selectedHaras,state.selectedMare);
          });
          td.appendChild(inp);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    };
    renderEcos();
    table.appendChild(tbody);
    card.appendChild(table);

    const btnEco = h('button',{className:'btn-ficha-add',onClick:async ()=>{
      ecos.push({fecha:new Date().toISOString().slice(0,10),ovIzq:'',ovDer:'',utero:'',obs:''});
      await saveGynField(f.id,'datos',{...datos,ecos},state.selectedHaras,state.selectedMare);
      renderEcos();
    }},'＋ Agregar ecografía');
    card.appendChild(btnEco);

    const obsDiv = div('form-group');
    obsDiv.appendChild(h('label',{},'Observaciones'));
    const obsInp = h('textarea',{rows:'3',placeholder:'Observaciones...'},datos.observaciones||'');
    obsInp.style.cssText='border:1px solid var(--stone);border-radius:5px;padding:9px 12px;font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink);background:var(--cream);width:100%';
    obsInp.addEventListener('change',async e=>{
      await saveGynField(f.id,'datos',{...datos,observaciones:e.target.value},state.selectedHaras,state.selectedMare);
    });
    obsDiv.appendChild(obsInp);
    card.appendChild(obsDiv);
    panel.appendChild(card);
  }
}

function renderEstadisticasView() {
  const main = div('main');
  main.appendChild(h('div',{className:'section-title'},'Estadísticas reproductivas'));
  main.appendChild(h('div',{className:'section-sub'},'Resumen de la temporada'));
  const allMares = state.harasList.flatMap(h=>h.mares.map(m=>({...m,harasNombre:h.nombre})));
  const totalMares = allMares.length;
  const totalGyn = allMares.reduce((s,m)=>s+(m.gyn?m.gyn.length:0),0);
  const totalGest = allMares.reduce((s,m)=>s+(m.gest?m.gest.length:0),0);

  const summary = div('stat-grid');
  for (const [title,val,color] of [
    ['Total yeguas',totalMares,'var(--gold)'],
    ['Fichas ginecológicas',totalGyn,'var(--sage)'],
    ['Gestaciones',totalGest,'var(--rust)'],
    ['Haras activos',state.harasList.filter(h=>h.mares.length>0).length,'var(--stone-dark)']
  ]) {
    const card = div('stat-card');
    card.style.textAlign='center';
    const num = h('div',{},String(val));
    num.style.cssText='font-family:"Cormorant Garamond",serif;font-size:48px;font-weight:600;color:'+color;
    card.appendChild(num);
    card.appendChild(h('div',{className:'stat-card-title'},title));
    summary.appendChild(card);
  }
  main.appendChild(summary);

  const byHaras = div('stat-card');
  byHaras.appendChild(h('div',{className:'stat-card-title'},'🏡 Por haras'));
  for (const haras of state.harasList) {
    const pct = totalMares ? Math.round(haras.mares.length/totalMares*100) : 0;
    const row = div('stat-bar-row');
    row.appendChild(h('div',{className:'stat-bar-label'},haras.nombre));
    const track = div('stat-bar-track');
    const fill = div('stat-bar-fill');
    fill.style.cssText='width:'+pct+'%;background:var(--gold)';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(h('div',{className:'stat-bar-pct'},haras.mares.length));
    byHaras.appendChild(row);
  }
  main.appendChild(byHaras);
  return main;
}

      if (k==='especie') {
        inp=h('select',{});
        for (const o of ['Equino','Bovino','Otro']) inp.appendChild(h('option',{value:o,selected:o===state.newPaciente[k]},o));
      } else if (k==='sexo') {
        inp=h('select',{});
        for (const o of ['','Macho','Hembra','Castrado']) inp.appendChild(h('option',{value:o,selected:o===state.newPaciente[k]},o||'—'));
      } else {
        inp=h('input',{type:'text',value:state.newPaciente[k]});
      }
      inp.addEventListener('change',e=>{ state.newPaciente[k]=e.target.value; });
      fg.appendChild(inp);
      grid.appendChild(fg);
    }
    modal.appendChild(grid);
    const actions=div('modal-actions');
    actions.appendChild(h('button',{className:'btn-secondary',onClick:()=>setState({modal:null})},'Cancelar'));
    actions.appendChild(h('button',{className:'btn-save',onClick:addPaciente},'Agregar paciente'));
    modal.appendChild(actions);
  }

  overlay.appendChild(modal);
  return overlay;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML='';
  app.appendChild(renderHeader());
  app.appendChild(renderNav());
  app.appendChild(renderBreadcrumb());

  let view;
  if (state.view==='haras') view=renderHarasView();
  else if (state.view==='mares') view=renderMaresView();
  else if (state.view==='mare') view=renderMareView();
  else if (state.view==='internacion') view=renderInternacionView();
  else if (state.view==='paciente') view=renderPacienteView();
  else view=renderEstadisticasView();
  app.appendChild(view);

  const modal = renderModal();
  if (modal) app.appendChild(modal);
  if (state.toast) {
    const t=div('toast'+(state.toast.type==='error'?' error':''),state.toast.msg);
    app.appendChild(t);
  }
}

// ── Start ──
render();
initData().catch(console.error);
</script>
</body>
</html>
