<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SERENO" />
  <meta name="theme-color" content="#1a1612" />
  <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  <title>SERENO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    #loading { position:fixed; inset:0; background:#1a1612; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
    #loading img { width:200px; margin-bottom:20px; }
    #loading p { color:#b8953a; font-family:sans-serif; font-size:14px; letter-spacing:0.1em; }
    .dot { animation: blink 1.4s infinite both; }
    .dot:nth-child(2) { animation-delay:.2s; }
    .dot:nth-child(3) { animation-delay:.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  </style>
</head>
<body>
  <div id="loading">
    <p>SERENO <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
  </div>
  <div id="root"></div>
  <script>
    // Hide loading when React mounts
    const observer = new MutationObserver(() => {
      if (document.getElementById('root').children.length > 0) {
        document.getElementById('loading').style.display = 'none';
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), {childList: true});
  </script>
  <script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID";



// ─── PALETTE & STYLES ───────────────────────────────────────────────────────
const css = `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1612;
    --parchment: #f5f0e8;
    --cream: #faf7f2;
    --sage: #7a8c6e;
    --sage-light: #a8b89a;
    --rust: #8b4a2f;
    --rust-light: #c4785a;
    --gold: #b8953a;
    --gold-light: #d4af6a;
    --stone: #c8bfb0;
    --stone-dark: #8a7f72;
    --shadow: rgba(26,22,18,0.12);
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--parchment); color: var(--ink); }

  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* HEADER */
  .header {
    background: var(--ink);
    color: var(--parchment);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--gold);
  }
  .header-brand { display: flex; align-items: center; gap: 14px; }
  .header-logo {
    width: 42px; height: 42px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; letter-spacing: 0.04em; }
  .header-sub { font-size: 11px; color: var(--stone); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }
  .header-cal-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 7px 16px;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .header-cal-btn:hover { background: var(--gold); color: var(--ink); }
  .header-cal-btn.connected { border-color: var(--sage); color: var(--sage); }
  .header-cal-btn.connected:hover { background: var(--sage); color: white; }

  /* BREADCRUMB */
  .breadcrumb {
    background: var(--cream);
    border-bottom: 1px solid var(--stone);
    padding: 10px 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--stone-dark);
  }
  .breadcrumb span { cursor: pointer; transition: color 0.15s; }
  .breadcrumb span:hover { color: var(--rust); }
  .breadcrumb .active { color: var(--ink); font-weight: 500; cursor: default; }
  .breadcrumb .sep { color: var(--stone); }

  /* MAIN */
  .main { flex: 1; padding: 32px; max-width: 1100px; margin: 0 auto; width: 100%; }

  /* SECTION TITLE */
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .section-sub { font-size: 13px; color: var(--stone-dark); margin-bottom: 28px; }

  /* CARDS GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }

  /* HARAS CARD */
  .haras-card {
    background: white;
    border: 1px solid var(--stone);
    border-radius: 8px;
    padding: 24px 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .haras-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--gold);
  }
  .haras-card:hover { border-color: var(--gold); box-shadow: 0 6px 24px var(--shadow); transform: translateY(-2px); }
  .haras-card-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .haras-card-count { font-size: 12px; color: var(--stone-dark); }
  .haras-card-icon { font-size: 28px; margin-bottom: 12px; }

  /* ADD BUTTON */
  .btn-add {
    background: var(--ink);
    color: var(--parchment);
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
    margin-bottom: 24px;
  }
  .btn-add:hover { background: var(--rust); }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--stone);
    padding: 9px 18px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--ink); }

  /* MARE CARD */
  .mare-card {
    background: white;
    border: 1px solid var(--stone);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mare-card:hover { border-color: var(--sage); box-shadow: 0 6px 24px var(--shadow); transform: translateY(-2px); }
  .mare-photo {
    width: 100%; height: 140px; object-fit: cover;
    background: var(--parchment);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; color: var(--stone);
  }
  .mare-photo img { width: 100%; height: 140px; object-fit: cover; }
  .mare-info { padding: 14px 16px; }
  .mare-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; }
  .mare-breed { font-size: 12px; color: var(--stone-dark); margin-top: 2px; }
  .mare-tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tag-gyn { background: #e8f0e4; color: var(--sage); }
  .tag-gest { background: #fef3e2; color: var(--gold); }
  .tag-neo { background: #fde8e0; color: var(--rust); }
  .tag-rec { background: #e8e4f0; color: #6a5a8b; }

  .ficha-tab.active-rec { color: #6a5a8b; border-bottom-color: #6a5a8b; }

  .rec-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f0edf8; border: 1px solid #c8bfe0;
    border-radius: 6px; padding: 6px 12px;
    font-size: 12px; color: #6a5a8b; font-weight: 500;
    margin-top: 8px;
  }

  .donante-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f0f5ee; border: 1px solid #b8cdb0;
    border-radius: 6px; padding: 6px 12px;
    font-size: 12px; color: var(--sage); font-weight: 500;
    margin-top: 8px; cursor: pointer; transition: background 0.15s;
  }
  .donante-link:hover { background: #e0edd8; }

  /* MARE DETAIL */
  .mare-detail-header {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    margin-bottom: 32px;
    background: white;
    border: 1px solid var(--stone);
    border-radius: 10px;
    padding: 24px;
  }
  .mare-detail-photo {
    width: 140px; height: 140px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--parchment);
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; color: var(--stone);
    flex-shrink: 0;
    position: relative;
    cursor: pointer;
  }
  .mare-detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
    font-size: 13px; color: white; font-weight: 500;
    flex-direction: column; gap: 4px;
  }
  .mare-detail-photo:hover .photo-overlay { opacity: 1; }
  .mare-detail-info { flex: 1; }
  .mare-detail-name { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; margin-bottom: 4px; }
  .mare-detail-meta { font-size: 13px; color: var(--stone-dark); margin-bottom: 16px; }
  .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .meta-item label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--stone-dark); display: block; margin-bottom: 2px; }
  .meta-item span { font-size: 14px; font-weight: 500; }

  /* FICHAS TABS */
  .fichas-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--stone);
  }
  .ficha-tab {
    padding: 12px 24px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--stone-dark);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.04em;
  }
  .ficha-tab:hover { color: var(--ink); }
  .ficha-tab.active-gyn { color: var(--sage); border-bottom-color: var(--sage); }
  .ficha-tab.active-gest { color: var(--gold); border-bottom-color: var(--gold); }
  .ficha-tab.active-neo { color: var(--rust); border-bottom-color: var(--rust); }

  /* FORM */
  .ficha-panel {
    background: white;
    border: 1px solid var(--stone);
    border-radius: 10px;
    padding: 28px;
  }
  .ficha-section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin: 24px 0 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--stone);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ficha-section-title:first-child { margin-top: 0; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--stone-dark); font-weight: 500; }
  .form-group input,
  .form-group select,
  .form-group textarea {
    border: 1px solid var(--stone);
    border-radius: 5px;
    padding: 9px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--cream);
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--sage);
    background: white;
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group input[type="checkbox"] { width: auto; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; flex-direction: row; margin-top: 4px; }
  .checkbox-row label { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }

  /* ECO TABLE */
  .eco-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .eco-table th {
    background: var(--parchment);
    padding: 8px 10px;
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--stone-dark);
    border: 1px solid var(--stone);
    font-weight: 500;
  }
  .eco-table td {
    border: 1px solid var(--stone);
    padding: 0;
  }
  .eco-table td input {
    border: none;
    background: transparent;
    padding: 7px 10px;
    width: 100%;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
  }
  .eco-table td input:focus { outline: none; background: #fffbe8; }
  .btn-table-add {
    margin-top: 8px;
    font-size: 12px;
    padding: 5px 12px;
    border: 1px dashed var(--stone);
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    color: var(--stone-dark);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .btn-table-add:hover { border-color: var(--sage); color: var(--sage); }

  /* SAVE / CAL ACTIONS */
  .ficha-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--stone);
  }
  .btn-cal {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.2s;
  }
  .btn-cal:hover { background: #1558c0; }
  .btn-save {
    background: var(--sage);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.2s;
  }
  .btn-save:hover { background: #5a6e50; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,22,18,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal {
    background: white;
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; margin-bottom: 20px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--ink);
    color: var(--parchment);
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 2000;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 8px 24px var(--shadow);
    animation: slideUp 0.3s ease;
  }
  .toast.success { border-left: 4px solid var(--sage); }
  .toast.cal { border-left: 4px solid #1a73e8; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--stone-dark);
  }
  .empty-icon { font-size: 52px; margin-bottom: 16px; }
  .empty-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 8px; color: var(--ink); }
  .empty-sub { font-size: 13px; }

  .delete-btn {
    background: transparent;
    border: none;
    color: var(--stone-dark);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    transition: color 0.15s;
    margin-left: auto;
  }
  .delete-btn:hover { color: var(--rust); }


  /* INTERNACION */
  .nav-tabs {
    display: flex;
    gap: 0;
    background: var(--ink);
    padding: 0 32px;
    border-bottom: 3px solid var(--gold);
  }
  .nav-tab {
    padding: 12px 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--stone);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
  }
  .nav-tab:hover { color: var(--parchment); }
  .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .int-card {
    background: white;
    border: 1px solid var(--stone);
    border-radius: 8px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .int-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--rust);
  }
  .int-card:hover { border-color: var(--rust); box-shadow: 0 6px 24px var(--shadow); transform: translateY(-2px); }
  .int-card-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .int-card-meta { font-size: 12px; color: var(--stone-dark); margin-bottom: 10px; }
  .int-badge {
    display: inline-block;
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .int-badge-activa { background: #fde8e0; color: var(--rust); }
  .int-badge-alta { background: #e8f0e4; color: var(--sage); }

  .diario-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .diario-table th {
    background: var(--parchment); padding: 8px 10px;
    text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--stone-dark);
    border: 1px solid var(--stone); font-weight: 500;
  }
  .diario-table td { border: 1px solid var(--stone); padding: 0; }
  .diario-table td input, .diario-table td select, .diario-table td textarea {
    border: none; background: transparent;
    padding: 6px 8px; width: 100%;
    font-size: 12px; font-family: 'DM Sans', sans-serif;
  }
  .diario-table td input:focus, .diario-table td select:focus { outline: none; background: #fffbe8; }

  /* ESTADÍSTICAS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .stat-card {
    background: white; border: 1px solid var(--stone);
    border-radius: 10px; padding: 20px;
  }
  .stat-card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; font-weight: 600;
    color: var(--stone-dark); margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--stone); padding-bottom: 10px;
  }
  .stat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .stat-bar-label { font-size: 12px; color: var(--ink); min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-bar-track { flex: 1; background: var(--parchment); border-radius: 20px; height: 10px; overflow: hidden; }
  .stat-bar-fill { height: 100%; border-radius: 20px; transition: width 0.5s ease; }
  .stat-bar-pct { font-size: 11px; font-weight: 600; min-width: 36px; text-align: right; }
  .stat-big { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 600; color: var(--sage); text-align: center; padding: 10px 0; }
  .stat-big-label { font-size: 12px; color: var(--stone-dark); text-align: center; margin-top: -8px; }
  .stat-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .stat-table th { background: var(--parchment); padding: 7px 10px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--stone-dark); border-bottom: 1px solid var(--stone); }
  .stat-table td { padding: 8px 10px; border-bottom: 1px solid var(--parchment); }
  .stat-table tr:last-child td { border-bottom: none; }

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function formatDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function addDays(iso, n) {
  if (!iso) return "";
  const d = new Date(iso);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

// ─── GOOGLE CALENDAR ─────────────────────────────────────────────────────────
async function createCalendarEvent(title, date, description, colorId = "2") {
  if (!window._gcalToken) return false;
  try {
    const body = {
      summary: title,
      description,
      start: { date },
      end: { date },
      colorId,
      reminders: { useDefault: false, overrides: [{ method: "popup", minutes: 480 }] },
    };
    const r = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
      method: "POST",
      headers: { Authorization: `Bearer ${window._gcalToken}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    return r.ok;
  } catch { return false; }
}

async function sendGestacionToCalendar(mare, harasName, gest) {
  const events = [];
  const base = gest.fechaOvulacion;
  if (!base) return 0;

  // Controles preñez
  const controls = [
    [30, "Control preñez 30 días"],
    [45, "Control preñez 45 días"],
    [60, "Control preñez 60 días"],
    [90, "Control preñez 90 días"],
    [120, "Control preñez 120 días"],
    [150, "Control preñez 150 días"],
    [180, "Control preñez 180 días"],
    [210, "Control preñez 210 días"],
    [240, "Control preñez 240 días"],
  ];
  for (const [days, label] of controls) {
    events.push({ title: `🐴 ${label} — ${mare.name} (${harasName})`, date: addDays(base, days), desc: `Yegua: ${mare.name} | Haras: ${harasName}`, color: "2" });
  }

  // Vacunas
  if (gest.vacunaRhino3) events.push({ title: `💉 Rhinoneumonitis 3 — ${mare.name} (${harasName})`, date: gest.vacunaRhino3, desc: `Yegua: ${mare.name}`, color: "5" });
  if (gest.vacunaRota) events.push({ title: `💉 Rota/Triple — ${mare.name} (${harasName})`, date: gest.vacunaRota, desc: `Yegua: ${mare.name}`, color: "5" });
  if (gest.vacunaTriple) events.push({ title: `💉 Triple — ${mare.name} (${harasName})`, date: gest.vacunaTriple, desc: `Yegua: ${mare.name}`, color: "5" });

  // 20 días preparto
  if (gest.fechaParto) {
    const pre = addDays(gest.fechaParto, -20);
    events.push({ title: `⚠️ PREPARTO 20 días — ${mare.name} (${harasName})`, date: pre, desc: `Parto estimado: ${formatDate(gest.fechaParto)} | Yegua: ${mare.name}`, color: "6" });
  }

  let ok = 0;
  for (const ev of events) {
    const success = await createCalendarEvent(ev.title, ev.date, ev.desc, ev.color);
    if (success) ok++;
  }
  return ok;
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = "sereno_v2";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
}

function saveState(harasList, pacientes, padrillosList) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ harasList, pacientes, padrillosList }));
  } catch {}
}

function App() {
  const saved = loadState();
  const [harasList, setHarasList] = useState(saved?.harasList || INITIAL_HARAS);
  const [pacientes, setPacientes] = useState(saved?.pacientes || [MALAMBO_PACIENTE]);
  const [view, setView] = useState("haras");
  const [dbLoaded] = useState(true);
  const [saving] = useState(false);
  const [selectedHaras, setSelectedHaras] = useState(null);
  const [selectedMare, setSelectedMare] = useState(null);
  const [activeTab, setActiveTab] = useState("gyn");
  const [modal, setModal] = useState(null); // null | "addHaras" | "addMare" | "addPaciente"
  const [selectedPaciente, setSelectedPaciente] = useState(null);
  const [newPaciente, setNewPaciente] = useState({ nombre: "", especie: "Equino", sexo: "", pelaje: "", raza: "", madre: "", padre: "", propietario: "", haras: "" });
  const [padrillosList, setPadrillosList] = useState(saved?.padrillosList || []);
  const [selectedPadrillo, setSelectedPadrillo] = useState(null);
  const [padrilloTab, setPadrilloTab] = useState("ficha");
  const [newPadrillo, setNewPadrillo] = useState({ nombre:"", raza:"", pelaje:"", born:"", propietario:"", reseña:"" });
  const [toast, setToast] = useState(null);
  const [calConnected, setCalConnected] = useState(false);
  const [newHarasName, setNewHarasName] = useState("");
  const [newMare, setNewMare] = useState({ name: "", breed: "", born: "", color: "", rp: "", chip: "", isReceptora: false });
  const photoInputRef = useRef();

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  // ── Auto-save ──
  useEffect(() => {
    saveState(harasList, pacientes, padrillosList);
  }, [harasList, pacientes, padrillosList]);

  // ── Pacientes internacion ──
  const addPaciente = () => {
    if (!newPaciente.nombre.trim()) return;
    const p = { id: Date.now(), ...newPaciente, internaciones: [] };
    setPacientes(prev => [...prev, p]);
    setNewPaciente({ nombre: "", especie: "Equino", sexo: "", pelaje: "", raza: "", madre: "", padre: "", propietario: "", haras: "" });
    setModal(null);
    showToast("Paciente agregado");
  };
  const addInternacion = (pid) => {
    setPacientes(prev => prev.map(p => p.id === pid
      ? { ...p, internaciones: [...p.internaciones, emptyInternacion()] }
      : p
    ));
  };
  const updateInternacion = (pid, idx, data) => {
    setPacientes(prev => prev.map(p => {
      if (p.id !== pid) return p;
      const arr = [...p.internaciones]; arr[idx] = data;
      return { ...p, internaciones: arr };
    }));
  };
  const currentPaciente = () => pacientes.find(p => p.id === selectedPaciente);

  // ── Google Calendar auth ──
  const connectCalendar = () => {
    const CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID";
    const SCOPES = "https://www.googleapis.com/auth/calendar.events";
    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      redirect_uri: window.location.href.split("?")[0],
      response_type: "token",
      scope: SCOPES,
    });
    const url = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
    const popup = window.open(url, "gcal", "width=500,height=600");
    const timer = setInterval(() => {
      try {
        const hash = popup?.location?.hash;
        if (hash && hash.includes("access_token")) {
          clearInterval(timer);
          const token = new URLSearchParams(hash.slice(1)).get("access_token");
          window._gcalToken = token;
          setCalConnected(true);
          popup.close();
          showToast("✅ Google Calendar conectado");
        }
      } catch (_) {}
      if (popup?.closed) clearInterval(timer);
    }, 500);
  };

  // ── Haras ──
  const getHaras = id => harasList.find(h => h.id === id);
  const updateHaras = (hid, updater) => setHarasList(list => list.map(h => h.id === hid ? updater(h) : h));

  const addHaras = () => {
    if (!newHarasName.trim()) return;
    setHarasList(l => [...l, { id: Date.now(), name: newHarasName.trim(), mares: [] }]);
    setNewHarasName("");
    setModal(null);
    showToast("Haras agregado");
  };

  // ── Mares ──
  const addMare = () => {
    if (!newMare.name.trim()) return;
    const mare = { id: Date.now(), ...newMare, photo: null, isReceptora: newMare.isReceptora || false, gyn: [], gest: [], neo: [], rec: [] };
    updateHaras(selectedHaras, h => ({ ...h, mares: [...h.mares, mare] }));
    setNewMare({ name: "", breed: "", born: "", color: "", rp: "", chip: "" });
    setModal(null);
    showToast(`${mare.name} agregada`);
  };

  // ── Photo upload ──
  const handlePhoto = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      updateHaras(selectedHaras, h => ({
        ...h,
        mares: h.mares.map(m => m.id === selectedMare.id ? { ...m, photo: ev.target.result } : m),
      }));
      setSelectedMare(prev => ({ ...prev, photo: ev.target.result }));
    };
    reader.readAsDataURL(file);
  };

  // ── Fichas ──
  const currentMare = () => {
    const h = getHaras(selectedHaras);
    return h?.mares.find(m => m.id === selectedMare?.id);
  };

  const updateFicha = (type, idx, data) => {
    updateHaras(selectedHaras, h => ({
      ...h,
      mares: h.mares.map(m => {
        if (m.id !== selectedMare.id) return m;
        const arr = [...(m[type] || [])];
        arr[idx] = data;
        return { ...m, [type]: arr };
      }),
    }));
  };

  const addFicha = (type) => {
    const blank = type === "gyn" ? emptyGyn() : type === "gest" ? emptyGest() : type === "neo" ? emptyNeo() : emptyRec();
    updateHaras(selectedHaras, h => ({
      ...h,
      mares: h.mares.map(m => m.id === selectedMare.id ? { ...m, [type]: [...(m[type] || []), blank] } : m),
    }));
  };

  const deleteFicha = (type, idx) => {
    if (!window.confirm("¿Eliminar esta ficha? Esta acción no se puede deshacer.")) return;
    updateHaras(selectedHaras, h => ({
      ...h,
      mares: h.mares.map(m => {
        if (m.id !== selectedMare.id) return m;
        const arr = [...(m[type] || [])];
        arr.splice(idx, 1);
        return { ...m, [type]: arr };
      }),
    }));
    showToast("Ficha eliminada");
  };

  const deleteMare = (mareId) => {
    if (!window.confirm("¿Eliminar esta yegua y todas sus fichas? Esta acción no se puede deshacer.")) return;
    updateHaras(selectedHaras, h => ({ ...h, mares: h.mares.filter(m => m.id !== mareId) }));
    setView("mares");
    showToast("Yegua eliminada");
  };

  const deleteHaras = (hid) => {
    if (!window.confirm("¿Eliminar este haras y todas sus yeguas? Esta acción no se puede deshacer.")) return;
    setHarasList(l => l.filter(h => h.id !== hid));
    showToast("Haras eliminado");
  };

  const deletePaciente = (pid) => {
    if (!window.confirm("¿Eliminar este paciente y sus internaciones?")) return;
    setPacientes(prev => prev.filter(p => p.id !== pid));
    setView("internacion");
    showToast("Paciente eliminado");
  };

  const deleteInternacion = (pid, idx) => {
    if (!window.confirm("¿Eliminar esta internación?")) return;
    setPacientes(prev => prev.map(p => {
      if (p.id !== pid) return p;
      const arr = [...p.internaciones]; arr.splice(idx, 1);
      return { ...p, internaciones: arr };
    }));
    showToast("Internación eliminada");
  };

  // ── Calendar push ──
  const pushToCalendar = async () => {
    if (!calConnected) { showToast("Conectá Google Calendar primero", "cal"); return; }
    const mare = currentMare();
    const harasName = getHaras(selectedHaras)?.name || "";
    const gestFichas = mare?.gest || [];
    let total = 0;
    for (const g of gestFichas) {
      total += await sendGestacionToCalendar(mare, harasName, g);
    }
    showToast(`📅 ${total} eventos creados en Google Calendar`, "cal");
  };

  // ── RENDER ──
  const haras = getHaras(selectedHaras);
  const mare = currentMare();

  return (
    <>
      <style>{css}</style>
      <div className="app">
        {/* HEADER */}
        <div className="header">
          <div className="header-brand">
            <div className="header-logo">🐴</div>
            <div>
              <div className="header-title">SERENO</div>
              <div className="header-sub">Gestión reproductiva equina</div>
            </div>
          </div>
          <button
            className={`header-cal-btn ${calConnected ? "connected" : ""}`}
            onClick={calConnected ? undefined : connectCalendar}
          >
            {calConnected ? "✅ Calendar conectado" : "🗓 Conectar Google Calendar"}
          </button>
        </div>

        {/* NAV TABS */}
        <div className="nav-tabs">
          <button className={`nav-tab ${!["internacion","paciente","padrillos","padrillo","estadisticas"].includes(view) ? "active" : ""}`}
            onClick={() => setView("haras")}>🐴 Reproductivo</button>
          <button className={`nav-tab ${["padrillos","padrillo"].includes(view) ? "active" : ""}`}
            onClick={() => setView("padrillos")}>🐎 Padrillos</button>
          <button className={`nav-tab ${["internacion","paciente"].includes(view) ? "active" : ""}`}
            onClick={() => setView("internacion")}>🏥 Internación</button>
          <button className={`nav-tab ${view === "estadisticas" ? "active" : ""}`}
            onClick={() => setView("estadisticas")}>📊 Estadísticas</button>
        </div>

        {/* BREADCRUMB */}
        <div className="breadcrumb">
          {!["internacion","paciente","estadisticas"].includes(view) ? <>
            <span onClick={() => setView("haras")}>Haras</span>
            {view !== "haras" && <><span className="sep">›</span><span onClick={() => setView("mares")}>{haras?.name}</span></>}
            {view === "mare" && <><span className="sep">›</span><span className="active">{mare?.name}</span></>}
          </> : view === "estadisticas" ? <>
            <span className="active">Estadísticas</span>
          </> : <>
            <span onClick={() => setView("internacion")}>Internación</span>
            {view === "paciente" && <><span className="sep">›</span><span className="active">{currentPaciente()?.nombre}</span></>}
          </>}
          {view === "estadisticas" && <span className="active">Estadísticas reproductivas</span>}
          {view === "padrillos" && <span className="active">Padrillos</span>}
          {view === "padrillo" && <><span onClick={() => setView("padrillos")} style={{cursor:"pointer"}}>Padrillos</span><span className="sep">›</span><span className="active">{selectedPadrillo?.nombre}</span></>}
        </div>

        <div className="main">

          {/* ── HARAS VIEW ── */}
          {view === "haras" && (
            <>
              <div className="section-title">Haras</div>
              <div className="section-sub">Seleccioná un haras para ver sus yeguas</div>
              <button className="btn-add" onClick={() => setModal("addHaras")}>＋ Agregar haras</button>
              {harasList.length === 0 ? (
                <div className="empty"><div className="empty-icon">🏇</div><div className="empty-title">Sin haras cargados</div><div className="empty-sub">Agregá el primer haras para comenzar</div></div>
              ) : (
                <div className="grid">
                  {harasList.map(h => (
                    <div key={h.id} className="haras-card" onClick={() => { setSelectedHaras(h.id); setView("mares"); }}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div className="haras-card-icon">🏡</div>
                        <button className="delete-btn" title="Eliminar haras" onClick={e => { e.stopPropagation(); deleteHaras(h.id); }}>🗑</button>
                      </div>
                      <div className="haras-card-name">{h.name}</div>
                      <div className="haras-card-count">{h.mares.length} yegua{h.mares.length !== 1 ? "s" : ""}</div>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}

          {/* ── MARES VIEW ── */}
          {view === "mares" && haras && (
            <>
              <div className="section-title">{haras.name}</div>
              <div className="section-sub">Yeguas registradas en este haras</div>
              <button className="btn-add" onClick={() => setModal("addMare")}>＋ Agregar yegua</button>
              {haras.mares.length === 0 ? (
                <div className="empty"><div className="empty-icon">🐎</div><div className="empty-title">Sin yeguas</div><div className="empty-sub">Agregá la primera yegua para comenzar</div></div>
              ) : (
                <div className="grid">
                  {haras.mares.map(m => (
                    <div key={m.id} className="mare-card" onClick={() => { setSelectedMare(m); setView("mare"); setActiveTab("gyn"); }}>
                      <div className="mare-photo">
                        {m.photo ? <img src={m.photo} alt={m.name} /> : "🐴"}
                      </div>
                      <div className="mare-info">
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div className="mare-name">{m.name}</div>
                          <button className="delete-btn" title="Eliminar yegua" onClick={e => { e.stopPropagation(); setSelectedMare(m); deleteMare(m.id); }}>🗑</button>
                        </div>
                        <div className="mare-breed">{m.breed || "Sin raza"} {m.born ? `· ${m.born}` : ""}</div>
                        <div className="mare-tags">
                          {m.isReceptora && <span className="tag tag-rec">Receptora</span>}
                          {(m.gyn?.length > 0) && <span className="tag tag-gyn">Gin ({m.gyn.length})</span>}
                          {(m.gest?.length > 0) && <span className="tag tag-gest">Gest ({m.gest.length})</span>}
                          {(m.neo?.length > 0) && <span className="tag tag-neo">Neo ({m.neo.length})</span>}
                          {(m.rec?.length > 0) && <span className="tag tag-rec">Rec ({m.rec.length})</span>}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}

          {/* ── MARE VIEW ── */}
          {view === "mare" && mare && (
            <>
              {/* Header yegua */}
              <div className="mare-detail-header">
                <div className="mare-detail-photo" onClick={() => photoInputRef.current.click()}>
                  {mare.photo ? <img src={mare.photo} alt={mare.name} /> : "🐴"}
                  <div className="photo-overlay"><span>📷</span><span>Cambiar foto</span></div>
                </div>
                <input ref={photoInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handlePhoto} />
                <div className="mare-detail-info">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div className="mare-detail-name">{mare.name}</div>
                    <button className="delete-btn" title="Eliminar yegua" style={{fontSize:18}} onClick={() => deleteMare(mare.id)}>🗑</button>
                  </div>
                  <div className="mare-detail-meta">{haras?.name}</div>
                  <div className="meta-grid">
                    <div className="meta-item"><label>Raza</label><span>{mare.breed || "—"}</span></div>
                    <div className="meta-item"><label>Nacimiento</label><span>{mare.born || "—"}</span></div>
                    <div className="meta-item"><label>Pelaje</label><span>{mare.color || "—"}</span></div>
                    <div className="meta-item"><label>RP</label><span>{mare.rp || "—"}</span></div>
                    <div className="meta-item"><label>Chip</label><span>{mare.chip || "—"}</span></div>
                  </div>
                </div>
              </div>

              {/* Tabs */}
              <div className="fichas-tabs">
                <button className={`ficha-tab ${activeTab === "gyn" ? "active-gyn" : ""}`} onClick={() => setActiveTab("gyn")}>
                  🔬 Ginecológica <span className="history-badge">{mare.gyn?.length || 0}</span>
                </button>
                <button className={`ficha-tab ${activeTab === "gest" ? "active-gest" : ""}`} onClick={() => setActiveTab("gest")}>

          {/* ── ESTADÍSTICAS VIEW ── */}
          {view === "estadisticas" && (() => {
            // ── Compute stats from all haras ──
            const allMares = harasList.flatMap(h => h.mares.map(m => ({...m, harasName: h.name})));

            // Per haras stats
            const harasStats = harasList.map(h => {
              const mares = h.mares;
              const totalGest = mares.reduce((acc, m) => acc + (m.gest?.length || 0), 0);
              const preñadas = mares.reduce((acc, m) => acc + (m.gest?.filter(g =>
                g.eco1 && g.resultado1?.includes('Positivo') ||
                g.eco2 && g.resultado2?.includes('Positivo') ||
                g.eco3 && g.resultado3?.includes('Positivo') ||
                g.observaciones?.toLowerCase().includes('preñez ok') ||
                g.observaciones?.toLowerCase().includes('preñez confirmada')
              ).length || 0), 0);
              const perdidas = mares.reduce((acc, m) => acc + (m.gest?.filter(g => g.perdioPreniez).length || 0), 0);
              return { name: h.name, total: mares.length, fichas: totalGest, preñadas, perdidas };
            }).filter(h => h.total > 0);

            // Per padrillo stats
            const padrilloMap = {};
            allMares.forEach(m => {
              [...(m.gest || []), ...(m.gyn || [])].forEach(f => {
                const p = f.padrillo;
                if (!p) return;
                if (!padrilloMap[p]) padrilloMap[p] = { servicios: 0, preñadas: 0 };
                padrilloMap[p].servicios++;
                const pos = f.resultado1?.includes('Positivo') || f.resultado2?.includes('Positivo') ||
                  f.resultado3?.includes('Positivo') ||
                  f.observaciones?.toLowerCase().includes('preñez ok') ||
                  f.observaciones?.toLowerCase().includes('preñez confirmada');
                if (pos) padrilloMap[p].preñadas++;
              });
            });
            const padrilloStats = Object.entries(padrilloMap)
              .map(([name, d]) => ({ name, ...d, pct: d.servicios ? Math.round(d.preñadas/d.servicios*100) : 0 }))
              .sort((a,b) => b.servicios - a.servicios).slice(0, 10);

            // Per técnica
            const tecnicaMap = {};
            allMares.forEach(m => {
              (m.gyn || []).forEach(f => {
                const t = f.tecnica || 'IA';
                if (!tecnicaMap[t]) tecnicaMap[t] = { total: 0, preñadas: 0 };
                tecnicaMap[t].total++;
                const pos = f.resultado1?.includes('Positivo') || f.resultado2?.includes('Positivo') ||
                  f.resultado3?.includes('Positivo') ||
                  f.observaciones?.toLowerCase().includes('preñez ok') ||
                  f.observaciones?.toLowerCase().includes('preñez confirmada');
                if (pos) tecnicaMap[t].preñadas++;
              });
            });
            const tecnicaColors = { IA: '#7a8c6e', TE: '#b8953a', ICSI: '#6a5a8b', OPU: '#8b4a2f' };

            // Per yegua historial
            const yeguaStats = allMares
              .filter(m => (m.gyn?.length || 0) + (m.gest?.length || 0) > 0)
              .map(m => {
                const ciclos = (m.gyn?.length || 0);
                const preñadas = (m.gest?.filter(g =>
                  g.observaciones?.toLowerCase().includes('preñez ok') ||
                  g.observaciones?.toLowerCase().includes('preñez confirmada') ||
                  g.resultado1?.includes('Positivo') || g.resultado2?.includes('Positivo')
                ).length || 0) + (m.gyn?.filter(g =>
                  g.resultado1?.includes('Positivo') || g.resultado2?.includes('Positivo') ||
                  g.observaciones?.toLowerCase().includes('preñez ok') ||
                  g.observaciones?.toLowerCase().includes('preñez confirmada')
                ).length || 0);
                const perdidas = (m.gest?.filter(g => g.perdioPreniez).length || 0);
                return { name: m.name, haras: m.harasName, ciclos, preñadas, perdidas };
              }).sort((a,b) => b.ciclos - a.ciclos);

            const totalMares = allMares.length;
            const totalPreñadas = harasStats.reduce((a,h) => a + h.preñadas, 0);
            const totalFichas = harasStats.reduce((a,h) => a + h.fichas, 0);
            const pctGlobal = totalFichas ? Math.round(totalPreñadas/totalFichas*100) : 0;

            return (
              <>
                <div className="section-title">Estadísticas reproductivas</div>
                <div className="section-sub">Temporada 2025-26 · Todos los haras</div>

                {/* KPIs */}
                <div className="stats-grid" style={{gridTemplateColumns:"repeat(auto-fill, minmax(160px,1fr))", marginBottom:28}}>
                  {[
                    { label: "Yeguas totales", val: totalMares, color: "var(--ink)" },
                    { label: "Fichas gestación", val: totalFichas, color: "var(--sage)" },
                    { label: "Preñeces confirmadas", val: totalPreñadas, color: "#b8953a" },
                    { label: "Tasa global", val: pctGlobal + "%", color: pctGlobal >= 60 ? "var(--sage)" : "var(--rust)" },
                  ].map(k => (
                    <div key={k.label} className="stat-card" style={{textAlign:"center"}}>
                      <div style={{fontFamily:"'Cormorant Garamond',serif", fontSize:44, fontWeight:600, color:k.color}}>{k.val}</div>
                      <div style={{fontSize:11, color:"var(--stone-dark)", marginTop:4}}>{k.label}</div>
                    </div>
                  ))}
                </div>

                <div className="stats-grid">
                  {/* Por haras */}
                  <div className="stat-card">
                    <div className="stat-card-title">🏡 Por haras</div>
                    {harasStats.map(h => (
                      <div key={h.name} className="stat-bar-row">
                        <div className="stat-bar-label">{h.name}</div>
                        <div className="stat-bar-track">
                          <div className="stat-bar-fill" style={{
                            width: h.fichas ? `${Math.round(h.preñadas/h.fichas*100)}%` : '0%',
                            background: "var(--sage)"
                          }} />
                        </div>
                        <div className="stat-bar-pct" style={{color:"var(--sage)"}}>
                          {h.fichas ? Math.round(h.preñadas/h.fichas*100) : 0}%
                        </div>
                      </div>
                    ))}
                    <div style={{fontSize:10,color:"var(--stone-dark)",marginTop:12}}>Preñeces confirmadas / fichas gestación</div>
                  </div>

                  {/* Por técnica */}
                  <div className="stat-card">
                    <div className="stat-card-title">🔬 Por técnica</div>
                    {Object.entries(tecnicaMap).map(([tec, d]) => (
                      <div key={tec} className="stat-bar-row">
                        <div className="stat-bar-label">{tec} ({d.total} serv.)</div>
                        <div className="stat-bar-track">
                          <div className="stat-bar-fill" style={{
                            width: d.total ? `${Math.round(d.preñadas/d.total*100)}%` : '0%',
                            background: tecnicaColors[tec] || "var(--sage)"
                          }} />
                        </div>
                        <div className="stat-bar-pct" style={{color: tecnicaColors[tec] || "var(--sage)"}}>
                          {d.total ? Math.round(d.preñadas/d.total*100) : 0}%
                        </div>
                      </div>
                    ))}
                    <div style={{fontSize:10,color:"var(--stone-dark)",marginTop:12}}>Tasa de preñez por técnica reproductiva</div>
                  </div>

                  {/* Por padrillo */}
                  <div className="stat-card" style={{gridColumn:"span 1"}}>
                    <div className="stat-card-title">🐎 Por padrillo (top 10)</div>
                    {padrilloStats.map(p => (
                      <div key={p.name} className="stat-bar-row">
                        <div className="stat-bar-label" title={p.name}>{p.name}</div>
                        <div className="stat-bar-track">
                          <div className="stat-bar-fill" style={{width:`${p.pct}%`, background:"var(--gold)"}} />
                        </div>
                        <div className="stat-bar-pct" style={{color:"var(--gold)"}}>{p.pct}%</div>
                      </div>
                    ))}
                    <div style={{fontSize:10,color:"var(--stone-dark)",marginTop:12}}>Servicios con resultado positivo</div>
                  </div>
                </div>

                {/* Por yegua */}
                <div className="stat-card" style={{marginTop:0}}>
                  <div className="stat-card-title">🐴 Historial por yegua</div>
                  <div style={{overflowX:"auto"}}>
                    <table className="stat-table">
                      <thead>
                        <tr>
                          <th>Yegua</th>
                          <th>Haras</th>
                          <th>Ciclos</th>
                          <th>Preñeces</th>
                          <th>Pérdidas</th>
                          <th>Tasa</th>
                        </tr>
                      </thead>
                      <tbody>
                        {yeguaStats.map(y => (
                          <tr key={y.name+y.haras}>
                            <td style={{fontWeight:500}}>{y.name}</td>
                            <td style={{color:"var(--stone-dark)"}}>{y.haras}</td>
                            <td style={{textAlign:"center"}}>{y.ciclos}</td>
                            <td style={{textAlign:"center"}}>
                              <span className={y.preñadas > 0 ? "badge-pos" : "badge-pend"}>{y.preñadas}</span>
                            </td>
                            <td style={{textAlign:"center"}}>
                              {y.perdidas > 0 ? <span className="badge-neg">{y.perdidas}</span> : <span style={{color:"var(--stone-dark)"}}>—</span>}
                            </td>
                            <td style={{textAlign:"center", fontWeight:600,
                              color: y.ciclos ? (y.preñadas/y.ciclos >= 0.5 ? "var(--sage)" : "var(--rust)") : "var(--stone-dark)"}}>
                              {y.ciclos ? Math.round(y.preñadas/y.ciclos*100) + "%" : "—"}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </>
            );
          })()}

        {/* ── MODALS ── */}
        {modal === "addPadrillo" && (
          <div className="modal-overlay" onClick={() => setModal(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-title">Nuevo padrillo</div>
              <div className="form-grid" style={{marginBottom:14}}>
                {[["nombre","Nombre *"],["raza","Raza"],["pelaje","Pelaje"],["born","Año nacimiento"],["propietario","Propietario"]].map(([k,lbl]) => (
                  <div key={k} className="form-group"><label>{lbl}</label>
                    <input value={newPadrillo[k]||""} onChange={e => setNewPadrillo(p => ({...p,[k]:e.target.value}))} />
                  </div>
                ))}
                <div className="form-group full"><label>Reseña</label>
                  <textarea rows={2} value={newPadrillo.reseña||""} onChange={e => setNewPadrillo(p => ({...p,reseña:e.target.value}))} />
                </div>
              </div>
              <div className="modal-actions">
                <button className="btn-secondary" onClick={() => setModal(null)}>Cancelar</button>
                <button className="btn-save" onClick={() => {
                  if (!newPadrillo.nombre.trim()) return;
                  const pad = { id: Date.now(), ...newPadrillo, espermogramas:[], extracciones:[] };
                  setPadrillosList(l => [...l, pad]);
                  setNewPadrillo({ nombre:"", raza:"", pelaje:"", born:"", propietario:"", reseña:"" });
                  setModal(null); showToast(`${pad.nombre} agregado`);
                }}>Agregar</button>
              </div>
            </div>
          </div>
        )}

        {modal === "addHaras" && (
          <div className="modal-overlay" onClick={() => setModal(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-title">Nuevo haras</div>
              <div className="form-group">
                <label>Nombre del haras</label>
                <input autoFocus value={newHarasName} onChange={e => setNewHarasName(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && addHaras()} />
              </div>
              <div className="modal-actions">
                <button className="btn-secondary" onClick={() => setModal(null)}>Cancelar</button>
                <button className="btn-save" onClick={addHaras}>Agregar</button>
              </div>
            </div>
          </div>
        )}

        {modal === "addMare" && (
          <div className="modal-overlay" onClick={() => setModal(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-title">Nueva yegua</div>
              <div className="form-grid" style={{ marginBottom: 14 }}>
                {[["name","Nombre *"],["breed","Raza"],["born","Año nacimiento"],["color","Pelaje"],["rp","RP"],["chip","N° chip"]].map(([k, label]) => (
                  <div key={k} className="form-group">
                    <label>{label}</label>
                    <input value={newMare[k]} onChange={e => setNewMare(p => ({ ...p, [k]: e.target.value }))} />
                  </div>
                ))}
              </div>
              <div className="form-group" style={{ marginBottom: 14 }}>
                <div className="checkbox-row">
                  <input type="checkbox" id="isRec" checked={newMare.isReceptora} onChange={e => setNewMare(p => ({ ...p, isReceptora: e.target.checked }))} />
                  <label htmlFor="isRec" style={{fontSize:13,color:"#6a5a8b",fontWeight:500}}>🔁 Esta yegua es receptora</label>
                </div>
              </div>
              <div className="modal-actions">
                <button className="btn-secondary" onClick={() => setModal(null)}>Cancelar</button>
                <button className="btn-save" onClick={addMare}>Agregar yegua</button>
              </div>
            </div>
          </div>
        )}

        {modal === "addPaciente" && (
          <div className="modal-overlay" onClick={() => setModal(null)}>
            <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth:540}}>
              <div className="modal-title">Nuevo paciente</div>
              <div className="form-grid" style={{marginBottom:14}}>
                <div className="form-group full"><label>Nombre *</label>
                  <input autoFocus value={newPaciente.nombre} onChange={e => setNewPaciente(p => ({...p, nombre: e.target.value}))} />
                </div>
                <div className="form-group"><label>Especie</label>
                  <select value={newPaciente.especie} onChange={e => setNewPaciente(p => ({...p, especie: e.target.value}))}>
                    <option>Equino</option><option>Bovino</option><option>Otro</option>
                  </select>
                </div>
                <div className="form-group"><label>Sexo</label>
                  <select value={newPaciente.sexo} onChange={e => setNewPaciente(p => ({...p, sexo: e.target.value}))}>
                    <option value="">—</option><option>Macho</option><option>Hembra</option><option>Castrado</option>
                  </select>
                </div>
                <div className="form-group"><label>Pelaje</label>
                  <input value={newPaciente.pelaje} onChange={e => setNewPaciente(p => ({...p, pelaje: e.target.value}))} />
                </div>
                <div className="form-group"><label>Raza</label>
                  <input value={newPaciente.raza} onChange={e => setNewPaciente(p => ({...p, raza: e.target.value}))} />
                </div>
                <div className="form-group"><label>Madre</label>
                  <input value={newPaciente.madre} onChange={e => setNewPaciente(p => ({...p, madre: e.target.value}))} />
                </div>
                <div className="form-group"><label>Padre</label>
                  <input value={newPaciente.padre} onChange={e => setNewPaciente(p => ({...p, padre: e.target.value}))} />
                </div>
                <div className="form-group"><label>Propietario</label>
                  <input value={newPaciente.propietario} onChange={e => setNewPaciente(p => ({...p, propietario: e.target.value}))} placeholder="Ej: G. Solá" />
                </div>
                <div className="form-group"><label>Haras / Establecimiento</label>
                  <input value={newPaciente.haras} onChange={e => setNewPaciente(p => ({...p, haras: e.target.value}))} />
                </div>
              </div>
              <div className="modal-actions">
                <button className="btn-secondary" onClick={() => setModal(null)}>Cancelar</button>
                <button className="btn-save" onClick={addPaciente}>Agregar paciente</button>
              </div>
            </div>
          </div>
        )}

        {/* TOAST */}
        {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
